<!doctype html>
<meta charset="utf-8">
<title>polyviz — loop nest → polyhedron</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --accent: #2a78d6; --critical: #d03b3b;
    --c-early: #cde2fb; --c-late: #0d366b; --c-future: #e1e0d9; --hull: #2a78d6; --hull-edge: #1c5cab;
    --kw: #4a3aa7; --num: #eb6834; --bi: #1baf7a; --str: #008300; --cm: #898781;
    --raw: #eb6834; --war: #1baf7a; --waw: #e87ba4; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --accent: #3987e5; --critical: #e66767;
    --c-early: #3987e5; --c-late: #cde2fb; --c-future: #52514e; --hull: #3987e5; --hull-edge: #86b6ef;
    --kw: #9085e9; --num: #eb6834; --bi: #1baf7a; --str: #0ca30c; --cm: #898781;
    --raw: #d95926; --war: #199e70; --waw: #d55181; --bad: #e66767;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --accent: #3987e5; --critical: #e66767;
    --c-early: #3987e5; --c-late: #cde2fb; --c-future: #52514e; --hull: #3987e5; --hull-edge: #86b6ef;
    --kw: #9085e9; --num: #eb6834; --bi: #1baf7a; --str: #0ca30c; --cm: #898781;
    --raw: #d95926; --war: #199e70; --waw: #d55181; --bad: #e66767;
  }
  html, body { margin: 0; height: 100%; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--page); }
  body { display: grid; grid-template-columns: auto 6px 1fr; }
  #split { cursor: col-resize; background: var(--grid); }
  #split:hover, #split.on { background: var(--accent); }
  aside { box-sizing: border-box; width: 480px; min-width: 260px; max-width: 70vw; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--grid); background: var(--surface); }
  h1 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
  h1 button { font-size: 12px; font-weight: normal; }
  label { color: var(--ink-2); font-size: 12px; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; font: 13px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 8px; background: var(--surface); color: var(--ink); }
  textarea { height: 220px; resize: vertical; white-space: pre; overflow-wrap: normal; overflow-x: auto; tab-size: 4; }
  .editor { position: relative; }
  .editor pre { position: absolute; inset: 0; margin: 0; padding: 8px; border: 1px solid transparent; font: 13px ui-monospace, Menlo, monospace; white-space: pre; overflow: hidden; tab-size: 4; pointer-events: none; color: var(--ink); }
  .editor textarea { position: relative; display: block; background: transparent; color: transparent; caret-color: var(--ink); }
  .kw { color: var(--kw); } .num { color: var(--num); } .bi { color: var(--bi); } .str { color: var(--str); } .cm { color: var(--cm); font-style: italic; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=range] { flex: 1; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); cursor: pointer; }
  #err { color: var(--critical); font: 12px ui-monospace, monospace; white-space: pre-wrap; min-height: 1.2em; }
  #stats { color: var(--muted); font-size: 12px; }
  #view { position: relative; }
  canvas { display: block; }
  #tip { position: absolute; pointer-events: none; display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font: 12px ui-monospace, monospace; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #legend { position: absolute; left: 12px; bottom: 12px; color: var(--ink-2); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  #legend b { width: 18px; height: 3px; border-radius: 2px; display: inline-block; margin: 0 4px 0 10px; }
  #legend i { width: 80px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--c-early), var(--c-late)); display: inline-block; }
</style>
<aside>
  <h1>polyviz <button id="theme" title="toggle light/dark">◐</button></h1>
  <label>Python loop nest — array reads/writes in the innermost body become dependence edges</label>
  <div class="editor"><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false"># in-place Gauss-Seidel sweeps: RAW within a sweep, WAR/WAW across sweeps
T, N = 3, 6
for t in range(T):
    for i in range(1, N - 1):
        for j in range(1, N - 1):
            A[i][j] = A[i-1][j] + A[i+1][j] + A[i][j-1] + A[i][j+1]</textarea></div>
  <label>Schedule θ(iters) — comma-separated affine exprs, optional</label>
  <input id="sched" type="text" value="t, t + i, t + j" placeholder="e.g.  i, i + j, k" spellcheck="false">
  <div id="err"></div>
  <div id="stats"></div>
  <label>Execution time (lexicographic order of the original nest)</label>
  <div class="row"><button id="play">▶</button><input id="t" type="range" min="0" max="0" value="0"></div>
  <div class="row"><label>speed <span id="speedv">1×</span></label><input id="speed" type="range" min="-2" max="3" step="0.1" value="0"></div>
  <label>Morph: original domain → scheduled domain</label>
  <div class="row"><input id="morph" type="range" min="0" max="1000" value="0"></div>
  <label><input id="hull" type="checkbox" checked> show convex hull</label>
  <label><input id="snd" type="checkbox" checked> sound while playing</label>
  <label><input id="deps" type="checkbox" checked> show dependences</label>
  <label><input id="prune" type="checkbox"> prune transitive edges</label>
</aside>
<div id="split"></div>
<div id="view"><div id="tip"></div><div id="legend"><span>early</span><i></i><span>late</span><span id="deplegend"></span></div></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(3, 5, 4); scene.add(sun);

const C_EARLY = new THREE.Color(), C_LATE = new THREE.Color(), C_FUTURE = new THREE.Color();
let data = null, pts = null, hullMesh = null, hullEdges = null, depLines = null, axes = null, labels = [];
const _m = new THREE.Matrix4(), _c = new THREE.Color();

// theme: CSS vars are the single source of truth; three.js pulls from them on (re)build
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme() {
  scene.background = new THREE.Color(cssVar('--surface'));
  C_EARLY.set(cssVar('--c-early')); C_LATE.set(cssVar('--c-late')); C_FUTURE.set(cssVar('--c-future'));
  if (data) build(data);
}
const saved = localStorage.getItem('theme'); if (saved) document.documentElement.dataset.theme = saved;
$('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches, cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  localStorage.setItem('theme', document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark'); applyTheme();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view); resize();

// full-height splitter: drag anywhere on the edge to resize the panel
const split = $('split'), aside = document.querySelector('aside');
split.addEventListener('pointerdown', e => { split.setPointerCapture(e.pointerId); split.classList.add('on'); });
split.addEventListener('pointermove', e => { if (split.classList.contains('on')) aside.style.width = e.clientX + 'px'; });
split.addEventListener('pointerup', () => split.classList.remove('on'));

function textSprite(txt, pos) {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const g = cv.getContext('2d'); g.font = '40px system-ui'; g.fillStyle = cssVar('--ink-2'); g.textAlign = 'center'; g.fillText(txt, 64, 48);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  s.scale.set(1.2, 0.6, 1); s.position.copy(pos); return s;
}

function clear() {
  for (const o of [pts, hullMesh, hullEdges, depLines, axes, ...labels]) if (o) scene.remove(o);
  pts = hullMesh = hullEdges = depLines = axes = null; labels = [];
}

// position of point i at the current morph value
function posAt(i, m, out) {
  const a = data.points[i], b = data.sched ? data.sched[i] : a;
  return out.set(a[0] + (b[0] - a[0]) * m, a[1] + (b[1] - a[1]) * m, a[2] + (b[2] - a[2]) * m);
}

function build(d) {
  clear(); data = d;
  const n = d.points.length;
  const keep = data === d && +$('t').max === n ? +$('t').value : n;
  $('t').max = n; $('t').value = keep;
  $('stats').textContent = `${n} iterations · dims (${d.names.join(', ')})${d.sched ? ' · schedule applied' : ''}`;

  pts = new THREE.InstancedMesh(new THREE.SphereGeometry(0.16, 12, 8), new THREE.MeshStandardMaterial({ roughness: .6 }), n);
  scene.add(pts);

  const hm = new THREE.MeshStandardMaterial({ color: cssVar('--hull'), transparent: true, opacity: .14, side: THREE.DoubleSide, depthWrite: false });
  hullMesh = new THREE.Mesh(new THREE.BufferGeometry(), hm); scene.add(hullMesh);
  hullEdges = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: cssVar('--hull-edge'), transparent: true, opacity: .6 })); scene.add(hullEdges);

  depLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .9 })); scene.add(depLines);

  // legality: edge s->d holds under theta iff theta(s) <lex theta(d); without a schedule, source order is the schedule
  const lex = (a, b) => { for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) return a[k] < b[k]; return false; };
  d.edges.forEach(e => e.bad = d.sched ? !lex(d.sched[e[0]], d.sched[e[1]]) : false);
  const ext = Math.max(1, ...d.points.flat(), ...(d.sched ? d.sched.flat() : []));
  axes = new THREE.AxesHelper(ext + 1); const ax = cssVar('--axis'); axes.setColors(ax, ax, ax); scene.add(axes);
  d.names.slice(0, 3).forEach((nm, k) => {
    const p = new THREE.Vector3(); p.setComponent(k, ext + 1.6); labels.push(textSprite(nm, p)); scene.add(labels.at(-1));
  });
  if (!camera.userData.placed) { camera.position.set(ext * 1.6, ext * 1.3, ext * 2.2); controls.target.set(ext / 2, ext / 2, ext / 2); camera.userData.placed = true; }
  update();
}

function update() {
  if (!data) return;
  const n = data.points.length, t = +$('t').value, m = +$('morph').value / 1000, v = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    posAt(i, m, v);
    const done = i < t;
    _m.makeScale(done ? 1 : .45, done ? 1 : .45, done ? 1 : .45).setPosition(v);
    pts.setMatrixAt(i, _m);
    pts.setColorAt(i, done ? _c.copy(C_EARLY).lerp(C_LATE, n > 1 ? i / (n - 1) : 0) : _c.copy(C_FUTURE));
  }
  pts.instanceMatrix.needsUpdate = true; pts.instanceColor.needsUpdate = true;

  // hull: faces of whichever domain the morph is closer to, vertices morphed
  const faces = (m < .5 ? data.faces : data.sched_faces) || [];
  const tri = new Float32Array(faces.length * 9), seg = new Float32Array(faces.length * 18);
  faces.forEach((f, k) => f.forEach((idx, j) => {
    posAt(idx, m, v); tri.set([v.x, v.y, v.z], k * 9 + j * 3);
    const q = posAt(f[(j + 1) % 3], m, new THREE.Vector3());
    seg.set([v.x, v.y, v.z, q.x, q.y, q.z], k * 18 + j * 6);
  }));
  hullMesh.geometry.dispose(); hullMesh.geometry = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(tri, 3)); hullMesh.geometry.computeVertexNormals();
  hullEdges.geometry.dispose(); hullEdges.geometry = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(seg, 3));
  hullMesh.visible = hullEdges.visible = $('hull').checked;

  // dependence edges, colored by kind (violated = red); fade those whose destination hasn't executed yet
  const show = data.edges.filter(e => !($('prune').checked && e[3]));
  const col = { RAW: new THREE.Color(cssVar('--raw')), WAR: new THREE.Color(cssVar('--war')), WAW: new THREE.Color(cssVar('--waw')) }, bad = new THREE.Color(cssVar('--bad')), surf = new THREE.Color(cssVar('--surface'));
  const ep = new Float32Array(show.length * 6), ec = new Float32Array(show.length * 6), q = new THREE.Vector3();
  show.forEach((e, k) => {
    posAt(e[0], m, v); posAt(e[1], m, q); ep.set([v.x, v.y, v.z, q.x, q.y, q.z], k * 6);
    _c.copy(e.bad ? bad : col[e[2]]); if (e[1] >= t) _c.lerp(surf, .75);
    ec.set([_c.r, _c.g, _c.b, _c.r, _c.g, _c.b], k * 6);
  });
  depLines.geometry.dispose(); depLines.geometry = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(ep, 3)).setAttribute('color', new THREE.BufferAttribute(ec, 3));
  depLines.visible = $('deps').checked && show.length > 0;
  const nbad = show.filter(e => e.bad).length, cnt = k => show.filter(e => e[2] === k).length;
  $('deplegend').innerHTML = !show.length ? '' : ['RAW', 'WAR', 'WAW'].filter(cnt).map(k => `<b style="background:var(--${k.toLowerCase()})"></b>${k} ${cnt(k)}`).join('')
    + (nbad ? `<b style="background:var(--bad)"></b>⚠ ${nbad} violated` : '');
}

// hover tooltip
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', e => {
  if (!pts) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(pts)[0], tip = $('tip');
  if (!hit) { tip.style.display = 'none'; return; }
  const i = hit.instanceId, p = data.points[i].slice(0, data.names.length);
  tip.style.display = 'block'; tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top + 12) + 'px';
  tip.textContent = `(${data.names.join(', ')}) = (${p.join(', ')})  t=${i}` + (data.sched ? `  θ=(${data.sched[i].slice(0, data.names.length).join(', ')})` : '');
});

// syntax highlight: one regex pass (comment | string | keyword | builtin | number) painted into the <pre> behind the textarea
const TOK = /(#.*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(for|in|if|elif|else|while|and|or|not|pass|True|False|None|def|return|lambda)\b|\b(range|min|max|abs|len|int)\b|\b(\d+)\b/g;
function highlight() {
  const ta = $('code'), esc = ta.value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  $('hl').innerHTML = esc.replace(TOK, (m, c, s, k, b, n) => `<span class="${c ? 'cm' : s ? 'str' : k ? 'kw' : b ? 'bi' : 'num'}">${m}</span>`) + '\n';
  $('hl').scrollTop = ta.scrollTop; $('hl').scrollLeft = ta.scrollLeft;
}
$('code').addEventListener('input', highlight); $('code').addEventListener('scroll', highlight); highlight();

// editor niceties: Tab inserts 4 spaces, Enter keeps (and after ':' grows) the indent
$('code').addEventListener('keydown', e => {
  const ta = e.target;
  if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); }
  else if (e.key === 'Enter') {
    const line = ta.value.slice(0, ta.selectionStart).split('\n').pop();
    e.preventDefault(); ta.setRangeText('\n' + line.match(/^\s*/)[0] + (line.trimEnd().endsWith(':') ? '    ' : ''), ta.selectionStart, ta.selectionEnd, 'end');
  } else return;
  ta.dispatchEvent(new Event('input'));
});

// live re-run (debounced)
let timer;
// compute via the local Python server if present; otherwise (static hosting, e.g. GitHub Pages)
// run app.py itself in the browser with Pyodide — same code, no second implementation
let py;
async function compute(code, schedule) {
  if (!py) {
    const res = await fetch('run', { method: 'POST', body: JSON.stringify({ code, schedule }) }).catch(() => null);
    if (res && res.ok) return res.json();
    $('stats').textContent = 'loading Python runtime (first visit ~15 MB)…';
    py = (async () => {
      const { loadPyodide } = await import('https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.mjs');
      const p = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
      await p.loadPackage(['numpy', 'scipy']);
      p.runPython('__name__ = "app"\n' + await (await fetch('app.py')).text());  // skip the __main__ server start p.runPython('import json');
      return p;
    })();
  }
  let p;
  try { p = await py; } catch (e) { py = null; return { error: 'Python runtime failed to load: ' + e.message }; }
  p.globals.set('_code', code); p.globals.set('_schedule', schedule);
  try { return JSON.parse(p.runPython('json.dumps(run(_code, _schedule))')); }
  catch (e) { return { error: e.message.trim().split('\n').pop() }; }
}

async function run() {
  const d = await compute($('code').value, $('sched').value);
  $('err').textContent = d.error || '';
  if (!d.error) build(d);
}
for (const id of ['code', 'sched']) $(id).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 400); });
for (const id of ['morph', 'deps', 'prune']) $(id).addEventListener(id === 'morph' ? 'input' : 'change', update);
$('t').addEventListener('input', e => { update(); blip(+e.target.value / +e.target.max); });
$('hull').addEventListener('change', update);  // some browsers don't fire `input` on checkboxes

// Web Audio blip per frame while playing: pitch rises with progress (no audio files)
let ac;
function blip(progress) {
  if (!$('snd').checked) return;
  (ac ??= new AudioContext()).resume();  // called from a user gesture (click / slider input): autoplay policy
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
  o.type = 'triangle'; o.frequency.value = 220 * 2 ** (progress * 3);  // 3 octaves across the run
  g.gain.setValueAtTime(0.12, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + 0.08);
}

let playing = false, acc = 0;
$('speed').addEventListener('input', e => $('speedv').textContent = (2 ** +e.target.value).toFixed(2).replace(/\.?0+$/, '') + '×');
$('play').onclick = () => {
  playing = !playing; $('play').textContent = playing ? '❚❚' : '▶'; if (playing && +$('t').value >= +$('t').max) $('t').value = 0; };
(function loop() {
  requestAnimationFrame(loop);
  if (playing && data) {
    // baseline: whole run in ~5 s at 60 fps; speed slider is log2 (0.25×–8×); fractional steps accumulate
    const t = $('t'); acc += (+t.max / 300) * 2 ** +$('speed').value;
    if (acc < 1) { controls.update(); renderer.render(scene, camera); return; }
    t.value = Math.min(+t.max, +t.value + Math.floor(acc)); acc %= 1;
    blip(+t.value / +t.max);
    if (+t.value >= +t.max) { playing = false; $('play').textContent = '▶'; }
    update();
  }
  controls.update(); renderer.render(scene, camera);
})();
run();
</script>
